name: CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

jobs:
  lint-and-typecheck:
    name: Lint and type-check
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The repo's .nvmrc pins Node 14 (EOL, with an expired root-CA bundle that
      # can no longer reach the package registry over TLS). package.json declares
      # engines.node ">=14.14.0", which a current LTS satisfies, so CI runs on a
      # supported Node version.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type-check test sources
        run: yarn test-compile
